<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="42" font-size="25" font-weight="700" fill="#17324d">文化財継承｜何を残すかを先に決め、介入を評価する</text><g transform="translate(40 92)" text-anchor="middle"><g><rect width="165" height="110" rx="14" fill="#f6d8d1" stroke="#b14f3b" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">脅威</text><text x="82" y="72" font-size="15" fill="#52606d">地震／火災／空家</text></g><g transform="translate(190)"><rect width="165" height="110" rx="14" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">価値属性</text><text x="82" y="72" font-size="15" fill="#52606d">形／材／技／用途</text></g><g transform="translate(380)"><rect width="165" height="110" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">介入</text><text x="82" y="72" font-size="15" fill="#52606d">補修／補強／転用</text></g><g transform="translate(570)"><rect width="165" height="110" rx="14" fill="#e8dfcd" stroke="#17324d" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">検証・記録</text><text x="82" y="72" font-size="15" fill="#52606d">根拠／可逆性／履歴</text></g><g transform="translate(760)"><rect width="165" height="110" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">継続利用</text><text x="82" y="72" font-size="15" fill="#52606d">主体／資金／管理</text></g></g><path d="M95 228H905" stroke="#2e7d75" stroke-width="6" marker-end="url(#a)"/><text x="500" y="280" text-anchor="middle" font-size="18" fill="#17324d">authenticity ≠ 古い材料だけ｜文化的文脈の中で価値を伝える能力</text><text x="500" y="322" text-anchor="middle" font-size="16" fill="#b14f3b">保存と活用を対立語にせず、価値を損なわない運用条件を書く</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#2e7d75"/></marker></defs></svg>
