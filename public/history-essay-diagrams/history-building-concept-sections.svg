<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="455" viewBox="0 0 1050 455"><rect width="1050" height="455" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="45" font-size="27" font-weight="700" fill="#17324d">概念断面｜三題は「何を外へ出し、何を固定したか」で読む</text><g transform="translate(35 95)" text-anchor="middle"><g><text x="155" y="0" font-size="21" font-weight="700" fill="#17324d">ポンピドゥー</text><rect x="55" y="40" width="200" height="190" fill="none" stroke="#17324d" stroke-width="5"/><path d="M55 80H255M55 120H255M55 160H255M55 200H255" stroke="#17324d" stroke-width="3"/><path d="M25 230L55 40M285 230L255 40" stroke="#b14f3b" stroke-width="7"/><path d="M270 210L310 60" stroke="#2e7d75" stroke-width="8"/><text x="155" y="270" font-size="16" fill="#52606d">外部構造・設備 → 自由な床</text></g><g transform="translate(350)"><text x="155" y="0" font-size="21" font-weight="700" fill="#17324d">山梨文化会館</text><rect x="50" y="35" width="48" height="200" rx="20" fill="#17324d"/><rect x="212" y="35" width="48" height="200" rx="20" fill="#17324d"/><path d="M98 75H212M98 135H212M98 195H212" stroke="#2e7d75" stroke-width="10"/><path d="M98 105H155M155 165H212" stroke="#b14f3b" stroke-width="5" stroke-dasharray="8 7"/><text x="155" y="270" font-size="16" fill="#52606d">固定コア＋後から加える床</text></g><g transform="translate(700)"><text x="155" y="0" font-size="21" font-weight="700" fill="#17324d">落水荘</text><path d="M130 40V230" stroke="#8b6b3f" stroke-width="28"/><path d="M130 85H290M130 145H250M130 205H220" stroke="#b14f3b" stroke-width="12"/><path d="M20 235Q100 190 180 235T310 235" fill="none" stroke="#2e7d75" stroke-width="8"/><path d="M15 215L95 185L130 205" fill="#8b6b3f" opacity=".55"/><text x="155" y="270" font-size="16" fill="#52606d">岩盤の核＋水上への片持床</text></g></g><text x="525" y="420" text-anchor="middle" font-size="19" fill="#17324d">断面の形 → 構造原理 → 使用・成長・場所との関係</text></g></svg>
