<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="42" font-size="25" font-weight="700" fill="#17324d">権力と造営｜人物名を空間的な因果へ変換する</text><g transform="translate(38 105)" text-anchor="middle"><g><rect width="160" height="105" rx="14" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="3"/><text x="80" y="38" font-size="19" font-weight="700" fill="#17324d">課題・正統性</text><text x="80" y="72" font-size="15" fill="#52606d">宗教／軍事／統治</text></g><g transform="translate(190)"><rect width="160" height="105" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="80" y="38" font-size="19" font-weight="700" fill="#17324d">資源動員</text><text x="80" y="72" font-size="15" fill="#52606d">土地／労働／技術</text></g><g transform="translate(380)"><rect width="160" height="105" rx="14" fill="#f6d8d1" stroke="#b14f3b" stroke-width="3"/><text x="80" y="38" font-size="19" font-weight="700" fill="#17324d">空間操作</text><text x="80" y="72" font-size="15" fill="#52606d">寺院／城郭／街路</text></g><g transform="translate(570)"><rect width="160" height="105" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="80" y="38" font-size="19" font-weight="700" fill="#17324d">行為の組織</text><text x="80" y="72" font-size="15" fill="#52606d">儀礼／群衆／交通</text></g><g transform="translate(760)"><rect width="160" height="105" rx="14" fill="#e8dfcd" stroke="#17324d" stroke-width="3"/><text x="80" y="38" font-size="19" font-weight="700" fill="#17324d">秩序の可視化</text><text x="80" y="72" font-size="15" fill="#52606d">国家／都市／記憶</text></g></g><path d="M95 235H905" stroke="#b14f3b" stroke-width="6" marker-end="url(#a)"/><text x="500" y="285" text-anchor="middle" font-size="18" fill="#17324d">人物伝ではなく「誰が、何のために、何を造り、人々をどう配置したか」</text><text x="500" y="325" text-anchor="middle" font-size="16" fill="#2e7d75">聖武＝寺院網｜秀吉＝城郭＋都市｜フランツ・ヨーゼフ＝環状街路＋公共建築</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#b14f3b"/></marker></defs></svg>
