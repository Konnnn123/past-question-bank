<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="42" font-size="25" font-weight="700" fill="#17324d">都市改造｜出来事を街路・境界・拠点の変化へ落とす</text><g transform="translate(38 95)" text-anchor="middle"><g><rect width="165" height="105" rx="14" fill="#f6d8d1" stroke="#b14f3b" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">契機</text><text x="82" y="72" font-size="15" fill="#52606d">火災／戦乱／統一</text></g><g transform="translate(190)"><rect width="165" height="105" rx="14" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">目的</text><text x="82" y="72" font-size="15" fill="#52606d">防火／軍事／交通</text></g><g transform="translate(380)"><rect width="165" height="105" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">空間操作</text><text x="82" y="72" font-size="15" fill="#52606d">街路／境界／移転</text></g><g transform="translate(570)"><rect width="165" height="105" rx="14" fill="#e8dfcd" stroke="#17324d" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">制度・実施</text><text x="82" y="72" font-size="15" fill="#52606d">規制／用地／主体</text></g><g transform="translate(760)"><rect width="165" height="105" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="82" y="38" font-size="19" font-weight="700" fill="#17324d">結果</text><text x="82" y="72" font-size="15" fill="#52606d">骨格／残存／限界</text></g></g><path d="M90 225H910" stroke="#b14f3b" stroke-width="6" marker-end="url(#a)"/><text x="500" y="280" text-anchor="middle" font-size="18" fill="#17324d">京都＝御土居・寺町｜江戸＝火除地・市街拡張｜ロンドン＝不燃化・建築規制</text><text x="500" y="322" text-anchor="middle" font-size="16" fill="#2e7d75">計画案と実施結果、短期復旧と長期都市骨格を分ける</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#b14f3b"/></marker></defs></svg>
