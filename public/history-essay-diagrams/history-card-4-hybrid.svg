<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="42" font-size="25" font-weight="700" fill="#17324d">異文化融合｜様式A＋Bではなく、選択的翻訳を見る</text><g transform="translate(45 95)" text-anchor="middle"><circle cx="90" cy="75" r="72" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="4"/><text x="90" y="66" font-size="19" font-weight="700" fill="#17324d">外来文化</text><text x="90" y="96" font-size="15" fill="#52606d">形式・技術・制度</text><circle cx="820" cy="75" r="72" fill="#dcebea" stroke="#2e7d75" stroke-width="4"/><text x="820" y="66" font-size="19" font-weight="700" fill="#17324d">在来条件</text><text x="820" y="96" font-size="15" fill="#52606d">材料・職能・気候</text><path d="M165 75H345M745 75H565" stroke="#17324d" stroke-width="6" marker-end="url(#a)"/><rect x="345" y="15" width="220" height="120" rx="18" fill="#f6d8d1" stroke="#b14f3b" stroke-width="4"/><text x="455" y="55" font-size="20" font-weight="700" fill="#17324d">媒介・選択</text><text x="455" y="88" font-size="16" fill="#52606d">人物／図像／施工</text><text x="455" y="116" font-size="16" fill="#b14f3b">どの部位が変わるか</text></g><text x="500" y="275" text-anchor="middle" font-size="19" fill="#17324d">大仏様：宋代技術 × 日本の寺院造営</text><text x="500" y="315" text-anchor="middle" font-size="19" fill="#2e7d75">擬洋風：西洋的表象 × 日本の木造・地方大工</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#17324d"/></marker></defs></svg>
