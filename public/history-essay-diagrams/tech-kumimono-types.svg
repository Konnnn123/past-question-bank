<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600">
  <rect width="1120" height="600" fill="#f7f4ed"/>
  <g font-family="Arial, 'Noto Sans JP', sans-serif">
    <text x="42" y="48" font-size="27" font-weight="700" fill="#17324d">和様組物｜軒を外へ持ち出す段階で比較する</text>
    <text x="42" y="78" font-size="16" fill="#52606d">compare components, projection, load distribution, and visual depth</text>
    <g fill="#17324d" stroke="#17324d" stroke-width="5">
      <g transform="translate(45 140)"><text x="95" y="-20" text-anchor="middle" font-size="20" stroke="none">舟肘木</text><rect x="82" y="190" width="26" height="170" fill="#e8dfcd"/><path d="M25 190 Q95 130 165 190" fill="#d4ad6a"/><line x1="10" y1="145" x2="180" y2="145"/><text x="95" y="400" text-anchor="middle" font-size="16" stroke="none">斗なし・柱上で受ける</text></g>
      <g transform="translate(260 140)"><text x="95" y="-20" text-anchor="middle" font-size="20" stroke="none">大斗肘木</text><rect x="82" y="190" width="26" height="170" fill="#e8dfcd"/><rect x="60" y="160" width="70" height="38" fill="#d4ad6a"/><path d="M25 145 H165"/><line x1="10" y1="115" x2="180" y2="115"/><text x="95" y="400" text-anchor="middle" font-size="16" stroke="none">大斗＋肘木</text></g>
      <g transform="translate(475 140)"><text x="95" y="-20" text-anchor="middle" font-size="20" stroke="none">平三斗</text><rect x="82" y="190" width="26" height="170" fill="#e8dfcd"/><rect x="60" y="160" width="70" height="38" fill="#d4ad6a"/><path d="M15 145 H175"/><rect x="12" y="112" width="45" height="38" fill="#d4ad6a"/><rect x="73" y="112" width="45" height="38" fill="#d4ad6a"/><rect x="134" y="112" width="45" height="38" fill="#d4ad6a"/><line x1="0" y1="95" x2="190" y2="95"/><text x="95" y="400" text-anchor="middle" font-size="16" stroke="none">壁面内で三点支持</text></g>
      <g transform="translate(690 140)"><text x="95" y="-20" text-anchor="middle" font-size="20" stroke="none">出三斗</text><rect x="82" y="190" width="26" height="170" fill="#e8dfcd"/><rect x="60" y="160" width="70" height="38" fill="#d4ad6a"/><path d="M15 145 H175"/><rect x="12" y="112" width="45" height="38" fill="#d4ad6a"/><rect x="73" y="112" width="45" height="38" fill="#d4ad6a"/><rect x="134" y="112" width="45" height="38" fill="#d4ad6a"/><path d="M95 112 L160 50" stroke="#b14f3b" stroke-width="9"/><line x1="145" y1="45" x2="205" y2="45"/><text x="95" y="400" text-anchor="middle" font-size="16" stroke="none">直交材で一手持出す</text></g>
      <g transform="translate(870 140)"><text x="95" y="-20" text-anchor="middle" font-size="20" stroke="none">出組・多手先</text><rect x="82" y="190" width="26" height="170" fill="#e8dfcd"/><rect x="60" y="160" width="70" height="38" fill="#d4ad6a"/><path d="M95 160 L145 110 L195 60" stroke="#b14f3b" stroke-width="10"/><rect x="120" y="88" width="52" height="36" fill="#d4ad6a"/><rect x="170" y="38" width="52" height="36" fill="#d4ad6a"/><line x1="175" y1="25" x2="235" y2="25"/><text x="95" y="400" text-anchor="middle" font-size="16" stroke="none">手先を重ね軒を支持</text></g>
    </g>
    <text x="560" y="565" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="19" fill="#b14f3b">名称 → 部材構成 → 軒の持出し → 荷重分散 → 軒下の意匠</text>
  </g>
</svg>
