<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470">
  <rect width="1080" height="470" fill="#f7f4ed"/>
  <g font-family="Arial, 'Noto Sans JP', sans-serif">
    <text x="42" y="48" font-size="27" font-weight="700" fill="#17324d">発掘成果を論述へ変換する証拠鎖</text>
    <text x="42" y="78" font-size="16" fill="#52606d">excavation does not directly reveal the whole upper structure</text>
    <g transform="translate(45 150)" font-size="19" text-anchor="middle">
      <g><rect x="0" y="0" width="170" height="100" rx="12" fill="#e8dfcd" stroke="#17324d" stroke-width="4"/><text x="85" y="42" fill="#17324d">従来説</text><text x="85" y="72" fill="#52606d">文献・現存例</text></g>
      <g><rect x="205" y="0" width="190" height="100" rx="12" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="4"/><text x="300" y="42" fill="#17324d">発掘証拠</text><text x="300" y="72" fill="#52606d">柱穴・基壇・溝・遺物</text></g>
      <g><rect x="430" y="0" width="190" height="100" rx="12" fill="#dcebea" stroke="#2e7d75" stroke-width="4"/><text x="525" y="42" fill="#17324d">確定できる範囲</text><text x="525" y="72" fill="#52606d">平面・年代・配置</text></g>
      <g><rect x="655" y="0" width="170" height="100" rx="12" fill="#e8dfcd" stroke="#17324d" stroke-width="4"/><text x="740" y="42" fill="#17324d">解釈の更新</text><text x="740" y="72" fill="#52606d">建築史像を修正</text></g>
      <g><rect x="860" y="0" width="170" height="100" rx="12" fill="#f6d8d1" stroke="#b14f3b" stroke-width="4"/><text x="945" y="42" fill="#17324d">留保</text><text x="945" y="72" fill="#52606d">上部復原は仮説</text></g>
      <g stroke="#2e7d75" stroke-width="5" marker-end="url(#arrow)"><line x1="170" y1="50" x2="200" y2="50"/><line x1="395" y1="50" x2="425" y2="50"/><line x1="620" y1="50" x2="650" y2="50"/><line x1="825" y1="50" x2="855" y2="50"/></g>
    </g>
    <text x="540" y="365" text-anchor="middle" font-size="20" fill="#b14f3b">答案の要点：「何が出たか」より「何がどこまで変わったか」</text>
    <text x="540" y="405" text-anchor="middle" font-size="18" fill="#52606d">復原図は、遺構＋出土部材＋現存類例＋文献を組み合わせた推定</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d75"/></marker></defs>
</svg>
