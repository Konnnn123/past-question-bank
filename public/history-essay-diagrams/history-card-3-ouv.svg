<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="42" font-size="25" font-weight="700" fill="#17324d">OUV｜価値語ではなく「基準―属性―歴史過程」で証明する</text><g transform="translate(45 90)"><rect width="260" height="150" rx="16" fill="#dcebea" stroke="#2e7d75" stroke-width="4"/><text x="130" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17324d">Criterion (ii)</text><text x="130" y="80" text-anchor="middle" font-size="18" fill="#52606d">価値・技術の交流</text><text x="130" y="116" text-anchor="middle" font-size="16" fill="#2e7d75">どこから → どこへ</text></g><g transform="translate(370 90)"><rect width="260" height="150" rx="16" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="4"/><text x="130" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17324d">物的属性</text><text x="130" y="80" text-anchor="middle" font-size="18" fill="#52606d">工場・建築・設備群</text><text x="130" y="116" text-anchor="middle" font-size="16" fill="#8b6b3f">何が今も証明するか</text></g><g transform="translate(695 90)"><rect width="260" height="150" rx="16" fill="#f6d8d1" stroke="#b14f3b" stroke-width="4"/><text x="130" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#17324d">Criterion (iv)</text><text x="130" y="80" text-anchor="middle" font-size="18" fill="#52606d">歴史段階の例証</text><text x="130" y="116" text-anchor="middle" font-size="16" fill="#b14f3b">何の典型か</text></g><path d="M305 165H365M630 165H690" stroke="#17324d" stroke-width="6"/><text x="500" y="285" text-anchor="middle" font-size="19" fill="#17324d">「古い・有名・美しい」だけではOUVの論証にならない</text><text x="500" y="325" text-anchor="middle" font-size="16" fill="#b14f3b">注意：ル・コルビュジエ作品群の現行基準は (i)(ii)(vi)</text></g></svg>
