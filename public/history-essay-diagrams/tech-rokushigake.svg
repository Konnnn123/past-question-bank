<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660">
  <rect width="1080" height="660" fill="#f7f4ed"/>
  <g font-family="Arial, 'Noto Sans JP', sans-serif">
    <text x="42" y="48" font-size="27" font-weight="700" fill="#17324d">六枝掛｜垂木割と三斗組を同じ寸法体系へ統合</text>
    <text x="42" y="78" font-size="16" fill="#52606d">one branch = rafter width + interval; six branches coordinate three bearing blocks</text>
    <g transform="translate(120 120)">
      <line x1="0" y1="65" x2="840" y2="65" stroke="#8b6b3f" stroke-width="8"/>
      <g fill="#2e7d75">
        <rect x="115" y="20" width="26" height="90"/><rect x="245" y="20" width="26" height="90"/>
        <rect x="375" y="20" width="26" height="90"/><rect x="505" y="20" width="26" height="90"/>
        <rect x="635" y="20" width="26" height="90"/><rect x="765" y="20" width="26" height="90"/>
      </g>
      <g fill="#d4ad6a" stroke="#17324d" stroke-width="4">
        <rect x="90" y="180" width="96" height="55"/><rect x="350" y="180" width="96" height="55"/><rect x="610" y="180" width="96" height="55"/>
        <rect x="330" y="340" width="136" height="66"/>
      </g>
      <rect x="90" y="250" width="616" height="52" rx="10" fill="#e8dfcd" stroke="#17324d" stroke-width="5"/>
      <rect x="363" y="406" width="70" height="80" fill="#e8dfcd" stroke="#17324d" stroke-width="5"/>
      <g stroke="#b14f3b" stroke-width="4" fill="none">
        <path d="M102 0 V-18 H284 V0"/><path d="M362 0 V-18 H544 V0"/><path d="M622 0 V-18 H804 V0"/>
        <path d="M90 165 V142 H706 V165"/>
      </g>
      <g fill="#b14f3b" font-size="18" text-anchor="middle">
        <text x="193" y="-26">2枝</text><text x="453" y="-26">2枝</text><text x="713" y="-26">2枝</text>
        <text x="398" y="135">三斗外法 ＝ 6枝</text>
      </g>
      <g fill="#17324d" font-size="18">
        <text x="820" y="75">垂木</text><text x="725" y="218">巻斗×3</text><text x="725" y="286">肘木</text><text x="480" y="385">大斗</text><text x="450" y="470">柱</text>
      </g>
    </g>
    <text x="540" y="635" text-anchor="middle" font-size="19" fill="#b14f3b">柱間寸法・垂木割・組物寸法が連動する設計システム</text>
  </g>
</svg>
