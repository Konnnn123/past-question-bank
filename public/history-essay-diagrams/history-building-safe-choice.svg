<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="410" viewBox="0 0 1050 410"><rect width="1050" height="410" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="45" font-size="27" font-weight="700" fill="#17324d">五選二｜六つの安全枠から異なる原理を二つ選ぶ</text><g transform="translate(45 95)" text-anchor="middle"><g><rect width="285" height="85" rx="14" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="3"/><text x="142" y="34" font-size="20" font-weight="700" fill="#17324d">S1 圧縮・ドーム</text><text x="142" y="64" font-size="15" fill="#52606d">パンテオン／ハギア</text></g><g transform="translate(335)"><rect width="285" height="85" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="142" y="34" font-size="20" font-weight="700" fill="#17324d">S2 ゴシック骨架</text><text x="142" y="64" font-size="15" fill="#52606d">ランス／ケルン</text></g><g transform="translate(670)"><rect width="285" height="85" rx="14" fill="#f6d8d1" stroke="#b14f3b" stroke-width="3"/><text x="142" y="34" font-size="20" font-weight="700" fill="#17324d">S3 日本中世仏堂</text><text x="142" y="64" font-size="15" fill="#52606d">南大門／浄土堂／舎利殿</text></g><g transform="translate(0 125)"><rect width="285" height="85" rx="14" fill="#dcebea" stroke="#2e7d75" stroke-width="3"/><text x="142" y="34" font-size="20" font-weight="700" fill="#17324d">S4 神社本殿</text><text x="142" y="64" font-size="15" fill="#52606d">伊勢／春日／賀茂</text></g><g transform="translate(335 125)"><rect width="285" height="85" rx="14" fill="#e8dfcd" stroke="#17324d" stroke-width="3"/><text x="142" y="34" font-size="20" font-weight="700" fill="#17324d">S5 近代自由平面</text><text x="142" y="64" font-size="15" fill="#52606d">ドミノ／サヴォア</text></g><g transform="translate(670 125)"><rect width="285" height="85" rx="14" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="3"/><text x="142" y="34" font-size="20" font-weight="700" fill="#17324d">S6 コア・外骨格</text><text x="142" y="64" font-size="15" fill="#52606d">山梨／ポンピドゥー／中銀</text></g></g><text x="525" y="345" text-anchor=