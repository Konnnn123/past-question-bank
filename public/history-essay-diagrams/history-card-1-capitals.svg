<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <rect width="1000" height="360" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif" fill="#17324d">
  <text x="35" y="42" font-size="25" font-weight="700">都城比較｜形式の移植ではなく、統治と地形による変形</text>
  <g transform="translate(85 78)"><text x="140" y="0" text-anchor="middle" font-size="19" font-weight="700">中国都城の典型</text><rect x="10" y="22" width="260" height="210" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="4"/><rect x="82" y="35" width="116" height="45" fill="#b14f3b"/><text x="140" y="64" text-anchor="middle" fill="#fff" font-size="16">宮城</text><path d="M30 95H250M30 130H250M30 165H250M30 200H250M65 82V220M105 82V220M145 82V220M185 82V220M225 82V220" stroke="#8b6b3f" stroke-width="2"/><text x="140" y="258" text-anchor="middle" font-size="15">羅城・軸線・閉じた坊</text></g>
  <path d="M390 190H585" stroke="#2e7d75" stroke-width="7" marker-end="url(#a)"/><text x="487" y="165" text-anchor="middle" font-size="18" fill="#2e7d75">受容＋在地化</text><text x="487" y="225" text-anchor="middle" font-size="15">地形／防衛／統治力</text>
  <g transform="translate(630 78)"><text x="140" y="0" text-anchor="middle" font-size="19" font-weight="700">日本古代都城</text><path d="M10 22H230L270 70V232H10Z" fill="#dcebea" stroke="#2e7d75" stroke-width="4"/><rect x="82" y="35" width="116" height="45" fill="#17324d"/><text x="140" y="64" text-anchor="middle" fill="#fff" font-size="16">宮域</text><path d="M30 95H250M30 130H250M30 165H250M30 200H250M65 82V220M105 82V220M145 82V220M185 82V220M225 82V220" stroke="#2e7d75" stroke-width="2"/><text x="140" y="258" text-anchor="middle" font-size="15">条坊＋外京・地形的変形</text></g></g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#2e7d75"/></marker></defs></svg>
