<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="380" viewBox="0 0 1050 380"><rect width="1050" height="380" fill="#f7f4ed"/><g font-family="Arial,'Noto Sans JP',sans-serif"><text x="35" y="45" font-size="27" font-weight="700" fill="#17324d">図面識別｜固有名より先に五つの証拠を取る</text><g transform="translate(35 105)" text-anchor="middle"><g><circle cx="85" cy="75" r="72" fill="#f2d3a7" stroke="#8b6b3f" stroke-width="4"/><text x="85" y="65" font-size="21" font-weight="700" fill="#17324d">1 形</text><text x="85" y="95" font-size="15" fill="#52606d">中央／軸／層</text></g><g transform="translate(205)"><circle cx="85" cy="75" r="72" fill="#dcebea" stroke="#2e7d75" stroke-width="4"/><text x="85" y="65" font-size="21" font-weight="700" fill="#17324d">2 支持</text><text x="85" y="95" font-size="15" fill="#52606d">壁／柱／コア</text></g><g transform="translate(410)"><circle cx="85" cy="75" r="72" fill="#f6d8d1" stroke="#b14f3b" stroke-width="4"/><text x="85" y="65" font-size="21" font-weight="700" fill="#17324d">3 平面</text><text x="85" y="95" font-size="15" fill="#52606d">軸／格子／自由</text></g><g transform="translate(615)"><circle cx="85" cy="75" r="72" fill="#e8dfcd" stroke="#17324d" stroke-width="4"/><text x="85" y="65" font-size="21" font-weight="700" fill="#17324d">4 動線</text><text x="85" y="95" font-size="15" fill="#52606d">周歩／ランプ</text></g><g transform="translate(820)"><circle cx="85" cy="75" r="72" fill="#dcebea" stroke="#2e7d75" stroke-width="4"/><text x="85" y="65" font-size="21" font-weight="700" fill="#17324d">5 概念</text><text x="85" y="95" font-size="15" fill="#52606d">固定／成長</text></g></g><path d="M105 275H945" stroke="#b14f3b" stroke-width="7" marker-end="url(#a)"/><text x="525" y="325" text-anchor="middle" font-size="20" fill="#17324d">答案：概念語 → 図面根拠3点 → 空間的結果</text><text x="525" y="360" text-anchor="middle" font-size="16" fill="#2e7d75">名前が曖昧でも、観察できる構造・動線・空間は書ける</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#b14f3b"/></marker></defs></svg>
