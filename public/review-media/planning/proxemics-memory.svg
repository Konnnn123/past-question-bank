<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">プロクセミックスの四距離</title>
  <desc id="desc">身体から外側へ密接、個体、社会、公衆距離を示す同心円</desc>
  <rect width="960" height="560" rx="36" fill="#f5f3ff"/>
  <g transform="translate(350 280)" fill="none" stroke-width="34">
    <circle r="220" stroke="#ddd6fe"/>
    <circle r="166" stroke="#c4b5fd"/>
    <circle r="112" stroke="#a78bfa"/>
    <circle r="58" stroke="#7c3aed"/>
    <circle r="17" fill="#4c1d95" stroke="none"/>
  </g>
  <g font-family="sans-serif" fill="#4c1d95">
    <text x="648" y="128" font-size="27" font-weight="700">公衆距離</text><text x="648" y="160" font-size="22">3.6m 以上</text>
    <text x="648" y="232" font-size="27" font-weight="700">社会距離</text><text x="648" y="264" font-size="22">1.2–3.6m</text>
    <text x="648" y="336" font-size="27" font-weight="700">個体距離</text><text x="648" y="368" font-size="22">45–120cm</text>
    <text x="648" y="440" font-size="27" font-weight="700">密接距離</text><text x="648" y="472" font-size="22">0–45cm</text>
  </g>
  <path d="M558 113h64M508 216h114M458 320h164M408 424h214" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="10 9"/>
</svg>
