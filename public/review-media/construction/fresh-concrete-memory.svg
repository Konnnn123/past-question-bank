<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">フレッシュコンクリートの四概念</title>
  <desc id="desc">ワーカビリティーを中心に四つの近接概念を分ける図</desc>
  <rect width="960" height="520" rx="36" fill="#fff7ed"/>
  <circle cx="480" cy="260" r="98" fill="#9a3412"/>
  <text x="480" y="250" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="white">WORKABILITY</text>
  <text x="480" y="286" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ffedd5">施工全体のしやすさ</text>
  <g stroke="#fb923c" stroke-width="7">
    <path d="M400 198L246 118"/><path d="M560 198l154-80"/>
    <path d="M400 322l-154 80"/><path d="M560 322l154 80"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g><rect x="74" y="50" width="286" height="114" rx="24" fill="#ffedd5" stroke="#fdba74" stroke-width="4"/><text x="217" y="96" font-size="25" font-weight="700" fill="#7c2d12">CONSISTENCY</text><text x="217" y="132" font-size="20" fill="#9a3412">軟らかさ・流動性</text></g>
    <g><rect x="600" y="50" width="286" height="114" rx="24" fill="#ffedd5" stroke="#fdba74" stroke-width="4"/><text x="743" y="96" font-size="24" font-weight="700" fill="#7c2d12">分離抵抗性</text><text x="743" y="132" font-size="20" fill="#9a3412">均一性を保つ</text></g>
    <g><rect x="74" y="356" width="286" height="114" rx="24" fill="#ffedd5" stroke="#fdba74" stroke-width="4"/><text x="217" y="402" font-size="25" font-weight="700" fill="#7c2d12">FINISHABILITY</text><text x="217" y="438" font-size="20" fill="#9a3412">表面を仕上げやすい</text></g>
    <g><rect x="600" y="356" width="286" height="114" rx="24" fill="#ffedd5" stroke="#fdba74" stroke-width="4"/><text x="743" y="402" font-size="24" font-weight="700" fill="#7c2d12">運搬・打込み・締固め</text><text x="743" y="438" font-size="20" fill="#9a3412">分離せず施工できる</text></g>
  </g>
</svg>
